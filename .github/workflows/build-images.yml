name: Build & Push Service Images

on:
  push:
    branches: [main]
    paths:
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # Required to push to GHCR

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [service-a, service-b, service-dashboard]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: src/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Image digest
        run: echo "Pushed ${{ matrix.service }} → ${{ steps.meta.outputs.tags }}"

  trigger-cd:
    name: Trigger Codefresh CD promotion
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Fire Codefresh pipeline with IMAGE_TAG
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          echo "Triggering Codefresh CD promotion for IMAGE_TAG=${IMAGE_TAG}"
          HTTP_STATUS=$(curl -s -o /tmp/cf_response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CODEFRESH_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"variables\":[{\"key\":\"IMAGE_TAG\",\"value\":\"${IMAGE_TAG}\"}]}" \
            "https://g.codefresh.io/api/builds/${{ github.repository_owner }}/gitops-sre-demo")
          cat /tmp/cf_response.json
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Codefresh API returned HTTP ${HTTP_STATUS}" >&2
            exit 1
          fi
          echo "Codefresh build triggered — IMAGE_TAG=${IMAGE_TAG}"
