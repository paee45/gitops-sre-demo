name: CI — Lint, Test & Security Scan

on:
  push:
    branches: [main]
    paths:
      - "src/**"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write  # Required to upload Trivy SARIF results

jobs:
  # ────────────────────────────────────────────────────────────────
  # JOB 1: Lint & test Go services
  # ────────────────────────────────────────────────────────────────
  lint-and-test-go:
    name: Lint & Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [service-a, service-b]

    defaults:
      run:
        working-directory: src/${{ matrix.service }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/${{ matrix.service }}/go.mod
          cache: true
          cache-dependency-path: src/${{ matrix.service }}/go.sum

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: src/${{ matrix.service }}
          args: --timeout=3m

      - name: Unit tests
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: src/${{ matrix.service }}/coverage.out
          retention-days: 7

  # ────────────────────────────────────────────────────────────────
  # JOB 2: Build images and run Trivy scan (no push — CI gate only)
  # ────────────────────────────────────────────────────────────────
  scan:
    name: Trivy Scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [lint-and-test-go]
    # Dashboard has no Go code — scan it independently; Go jobs are a gate
    if: ${{ !failure() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: service-a
            needs_go: true
          - service: service-b
            needs_go: true
          - service: service-dashboard
            needs_go: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (local, no push)
        uses: docker/build-push-action@v5
        with:
          context: src/${{ matrix.service }}
          push: false
          load: true
          tags: ${{ matrix.service }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ matrix.service }}:scan
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"          # Fail CI on CRITICAL/HIGH CVEs

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()             # Upload even if scan step fails
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}
