# AI-Agent Sandbox RBAC
# ──────────────────────────────────────────────────────────────────────────────
# Creates a dedicated namespace + read-only ServiceAccount for AI tooling
# (GitHub Copilot, local agents, etc.).
#
# Permissions: cluster-admin — full access across the entire cluster.
#   ✅ all verbs on all resources in all namespaces
#   ✅ exec into pods, read secrets, manage nodes, CRDs, etc.
#   ⚠️  DEV ONLY — do not replicate this pattern in staging or production
#
# Usage:
#   kubectl apply -f k8s/aiops/ai-sandbox/rbac.yaml
#   # then run scripts/ai-sandbox-setup.sh to extract the kubeconfig
# ──────────────────────────────────────────────────────────────────────────────

apiVersion: v1
kind: Namespace
metadata:
  name: ai-sandbox
  labels:
    purpose: ai-agent-restricted
    managed-by: argocd

---
# ServiceAccount used by AI agents
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-agent
  namespace: ai-sandbox
  labels:
    purpose: ai-agent-restricted

---
# Long-lived token secret (required for kubeconfig extraction in K8s 1.24+)
apiVersion: v1
kind: Secret
metadata:
  name: ai-agent-token
  namespace: ai-sandbox
  annotations:
    kubernetes.io/service-account.name: ai-agent
  labels:
    purpose: ai-agent-restricted
type: kubernetes.io/service-account-token

---
# ClusterRoleBinding: binds the ai-agent ServiceAccount to the built-in
# cluster-admin ClusterRole — full access to all namespaces and resources.
# DEV CLUSTER ONLY.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-agent-cluster-admin
  labels:
    purpose: ai-agent-dev
subjects:
  - kind: ServiceAccount
    name: ai-agent
    namespace: ai-sandbox
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
