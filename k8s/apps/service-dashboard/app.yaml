---
# ArgoCD Application for Service Dashboard
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: service-dashboard-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/paee45/gitops-sre-demo
    targetRevision: main
    path: k8s/apps/service-dashboard
  destination:
    server: https://kubernetes.default.svc
    namespace: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  revisionHistoryLimit: 10
