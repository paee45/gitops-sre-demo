---
# Service Dashboard Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-dashboard
  namespace: apps
  labels:
    app: service-dashboard
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-dashboard
  template:
    metadata:
      labels:
        app: service-dashboard
        version: v1
      annotations:
        prometheus.io/scrape: "false"
    spec:
      serviceAccountName: service-dashboard
      restartPolicy: Always
      containers:
      - name: dashboard
        image: ghcr.io/paee45/service-dashboard:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: DASHBOARD_TOKEN
          valueFrom:
            secretKeyRef:
              name: dashboard-secret
              key: token
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 2
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        securityContext:
          runAsNonRoot: true
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL

---
# Service Account for Dashboard
apiVersion: v1
kind: ServiceAccount
metadata:
  name: service-dashboard
  namespace: apps

---
# ClusterRole for Dashboard to read cluster status
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: service-dashboard
rules:
- apiGroups: ["apps"]
  resources: ["deployments", "daemonsets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods", "services", "namespaces"]
  verbs: ["get", "list", "watch"]

---
# ClusterRoleBinding for Dashboard
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: service-dashboard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: service-dashboard
subjects:
- kind: ServiceAccount
  name: service-dashboard
  namespace: apps

---
# Secret for Dashboard token
apiVersion: v1
kind: Secret
metadata:
  name: dashboard-secret
  namespace: apps
type: Opaque
stringData:
  token: gitops-sre-demo-token-changeme
