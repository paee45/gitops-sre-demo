---
# Service Dashboard Service (ClusterIP - accessed via kubectl port-forward or Ingress)
apiVersion: v1
kind: Service
metadata:
  name: service-dashboard
  namespace: apps
  labels:
    app: service-dashboard
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 3000
    targetPort: http
    protocol: TCP
  selector:
    app: service-dashboard
