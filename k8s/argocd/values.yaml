# ArgoCD self-management Helm values
# ──────────────────────────────────────────────────────────────────────────────
# These values are used by BOTH:
#   1. Terraform / user-data.sh — initial one-time Helm install on EC2 boot
#   2. k8s/argocd/argocd-app.yaml — ongoing self-management via ArgoCD
#
# When ArgoCD manages itself any change pushed to this file is automatically
# applied (selfHeal: true). The initial bootstrap via Terraform installs ArgoCD
# with these same values, so the state is identical from day 1.
# ──────────────────────────────────────────────────────────────────────────────

global:
  nodeSelector: {}

redis:
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

server:
  replicas: 1
  service:
    type: NodePort
    nodePortHttp: 32080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  extraArgs:
    - --insecure   # Plain HTTP — fine for demo; add TLS termination for prod

repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

applicationSet:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

notifications:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

controller:
  replicas: 1
  args:
    operationProcessors: "2"
    statusProcessors: "5"
    appResyncPeriod: "180"
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 768Mi

configs:
  params:
    server.insecure: true
