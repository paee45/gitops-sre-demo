apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kong-crds
  namespace: argocd
  annotations:
    # sync-wave: 0 — CRDs must be installed before the Kong chart (wave 1)
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/paee45/gitops-sre-demo.git
    targetRevision: HEAD
    path: k8s/kong-crds
    directory:
      include: "*.yaml"
      exclude: "app.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: kong
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - Replace=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
