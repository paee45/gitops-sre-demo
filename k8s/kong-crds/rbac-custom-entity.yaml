# Grant the kong-kong ServiceAccount permission to list/watch KongCustomEntity
# The CRD is added manually (chart 2.38.0 doesn't include it) so the chart's
# generated ClusterRole doesn't cover it. This fills that gap.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kong-kong-custom-entity
rules:
  - apiGroups: ["configuration.konghq.com"]
    resources: ["kongcustomentities"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kong-kong-custom-entity
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kong-kong-custom-entity
subjects:
  - kind: ServiceAccount
    name: kong-kong
    namespace: kong
