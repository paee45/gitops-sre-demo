apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kong
  namespace: argocd
  annotations:
    # sync-wave: 1 — installs Kong chart before its config resources (wave 2)
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://charts.konghq.com
      chart: kong
      targetRevision: "2.38.0"
      helm:
        releaseName: kong
        valueFiles:
          - $values/k8s/kong/values.yaml
    - repoURL: https://github.com/paee45/gitops-sre-demo.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kong
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
  # Kong chart auto-generates self-signed TLS certs for its admission webhook on
  # every Helm render — the live cluster keeps the original cert bytes, creating
  # permanent diff noise.  Ignore these resources to keep the app Synced.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: kong-kong-validation-webhook-ca-keypair
      jsonPointers: ["/data"]
    - group: ""
      kind: Secret
      name: kong-kong-validation-webhook-keypair
      jsonPointers: ["/data"]
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: kong-kong-validations
      jsonPointers: ["/webhooks/0/clientConfig/caBundle", "/webhooks/1/clientConfig/caBundle"]
