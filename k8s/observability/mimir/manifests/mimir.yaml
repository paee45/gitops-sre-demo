# Mimir — single-binary (monolithic) deployment
# Runs ALL components in one pod using -target=all
# Replaces mimir-distributed chart (5 pods → 1 pod, ~1.6Gi limit → 512Mi limit)
#
# Service aliases keep existing DNS names intact:
#   Alloy/Tempo  → mimir-distributor.lgtm.svc:8080/api/v1/push
#   Grafana      → mimir-query-frontend.lgtm.svc:8080/prometheus
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir-config
  namespace: lgtm
data:
  mimir.yaml: |
    # Single-tenant: no X-Scope-OrgID header required
    multitenancy_enabled: false

    # All state via inmemory rings — no memberlist/gossip needed for 1 instance
    ingester:
      ring:
        replication_factor: 1
        kvstore:
          store: inmemory

    distributor:
      ring:
        kvstore:
          store: inmemory

    store_gateway:
      sharding_ring:
        replication_factor: 1
        kvstore:
          store: inmemory

    compactor:
      compaction_interval: 30m
      data_dir: /data/compactor
      ring:
        kvstore:
          store: inmemory

    ruler:
      ring:
        kvstore:
          store: inmemory

    # Filesystem storage — no S3/GCS needed for demo
    common:
      storage:
        backend: filesystem
        filesystem:
          dir: /data

    blocks_storage:
      backend: filesystem
      filesystem:
        dir: /data/blocks
      tsdb:
        dir: /data/tsdb

    limits:
      compactor_blocks_retention_period: 24h
      ingestion_rate: 10000
      ingestion_burst_size: 200000
      max_global_series_per_user: 1000000
      out_of_order_time_window: 15m

    # Kafka-based ingest storage — not needed for demo
    ingest_storage:
      enabled: false
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mimir
  namespace: lgtm
  labels:
    app: mimir
spec:
  serviceName: mimir
  replicas: 1
  selector:
    matchLabels:
      app: mimir
  template:
    metadata:
      labels:
        app: mimir
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: mimir
          image: grafana/mimir:2.14.0
          args:
            - -target=all
            - -config.file=/etc/mimir/mimir.yaml
            - -server.http-listen-port=8080
            - -server.grpc-listen-port=9095
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9095
          volumeMounts:
            - name: config
              mountPath: /etc/mimir
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: GOMEMLIMIT
              value: "460MiB"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 4
      volumes:
        - name: config
          configMap:
            name: mimir-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
---
# Headless service required by StatefulSet
apiVersion: v1
kind: Service
metadata:
  name: mimir
  namespace: lgtm
  labels:
    app: mimir
spec:
  clusterIP: None
  selector:
    app: mimir
  ports:
    - name: http
      port: 8080
    - name: grpc
      port: 9095
---
# DNS alias used by Alloy + Tempo metrics generator remote_write
apiVersion: v1
kind: Service
metadata:
  name: mimir-distributor
  namespace: lgtm
  labels:
    app: mimir
spec:
  selector:
    app: mimir
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# DNS alias used by Grafana datasource
apiVersion: v1
kind: Service
metadata:
  name: mimir-query-frontend
  namespace: lgtm
  labels:
    app: mimir
spec:
  selector:
    app: mimir
  ports:
    - name: http
      port: 8080
      targetPort: 8080
