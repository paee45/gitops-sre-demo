apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus
      targetRevision: "28.16.0"
      helm:
        releaseName: prometheus
        valueFiles:
          - $values/k8s/observability/prometheus/values.yaml
    - repoURL: https://github.com/paee45/gitops-sre-demo.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: lgtm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  # Alertmanager StatefulSet reports OutOfSync due to server-side-apply
  # managedFields ownership annotations — no actual drift in spec.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: prometheus-alertmanager
      jsonPointers:
        - /spec/volumeClaimTemplates
