# Tempo — single-binary trace backend
# Chart: grafana/tempo 1.24.4 — App: v2.9.0
# Retention: 7 days (168h)

tempo:
  retention: 168h     # 7 days

  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"
    jaeger:
      protocols:
        grpc:
          endpoint: "0.0.0.0:14250"

  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal

  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 300m
      memory: 384Mi

  extraEnv:
    - name: GOMEMLIMIT
      value: "345MiB"

  # Metrics generator — produces traces_spanmetrics_* and service-graph metrics
  # pushed to Mimir.  Powers the Service Map and RED panels in Grafana.
  metricsGenerator:
    enabled: true
    remoteWriteUrl: "http://mimir-distributor.lgtm.svc:8080/api/v1/push"
    storage:
      path: "/var/tempo/metrics"
    processor:
      service_graphs:
        wait: 10s
        max_items: 10000
      span_metrics:
        enable_target_info: true
    registry:
      collection_interval: 15s
      external_labels:
        cluster: k3s-demo

  # Enable processors for all tenants (single-tenant demo)
  overrides:
    defaults:
      metrics_generator:
        processors:
          - service-graphs
          - span-metrics

  # Increase probe delays — metrics-generator ring takes ~60s to join in k3d
  # (single-member ring needs to fully converge before /ready returns 200)
  livenessProbe:
    httpGet:
      path: /ready
      port: 3200
    initialDelaySeconds: 90
    periodSeconds: 10
    failureThreshold: 6
    timeoutSeconds: 5

  readinessProbe:
    httpGet:
      path: /ready
      port: 3200
    initialDelaySeconds: 20
    periodSeconds: 10
    failureThreshold: 6
    timeoutSeconds: 5

persistence:
  enabled: true
  size: 10Gi
  storageClassName: local-path

# Expose OTLP ports via ClusterIP service
service:
  type: ClusterIP
